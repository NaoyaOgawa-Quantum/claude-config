version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # requirements.txt の下限は「動く最低の版」 = 最新へ上げない (上げると requires_python で
    # macOS の /usr/bin/python3 = 3.9 が pip install できなくなる。 2026-10-03 #27-#29 を閉じた)。
    # conventions/github-security-automation.md#requirement-floor-vs-python
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
